name: verify

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC 跑一次 latest canary

permissions:
  contents: read

# 同一分支的连续推送取消前一次运行：省 CI 额度，也不会让旧提交的红灯盖住新提交的绿灯。
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      # fetch-depth: 0 + fetch-tags: 兼容性闸门靠「历史上打过 tag 的 preset id」判定，
      # 浅克隆里没有 tag，脚本会 exit 2（无法判定）。第五轮审计 T2-6：以前 CI 根本不跑它。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'   # Node 20 已 EOL；lib/ 用到 zstdDecompressSync（22.15+）

      # js-yaml 必须早于安装步骤：安装器会调用 verify-yaml，缺依赖时它会返回 2（跳过）。
      - name: Install js-yaml
        shell: bash
        run: npm install --no-save --silent js-yaml@4

      # 权威闸门：`npm run verify` 是 10 个检查串联的唯一入口（sync-lib 一致性 / YAML / 结构 / 文本审计 /
      # 基准防泄漏 / 版本一致 / 兼容闸门 / 基准表 / bash3.2 / ps1）。第六轮审计 U2-4：以前 CI 是逐项手抄，
      # 漏了 sync-lib --check、guard-bench-leak、verify-versions、render-bench-table --check 四个，
      # 于是「lib/ 忘了同步」「版本号漂移」「基准表漂移」这几类问题在 CI 里是绿的。
      - name: 权威闸门（npm run verify）
        shell: bash
        run: npm run verify

      # 别名表必须与仓库内的合成配置自洽（canonical 真的被发行、别名行真的在）。
      - name: 别名表 × 合成配置
        shell: bash
        run: node tools/probe/alias-vs-config.mjs --composed

      # 发布面卫生 + 办公基准复核清单：prepublishOnly 会跑，但 CI 之前一次都没跑过（同样属于「本地过、CI 不过」的盲区）。
      - name: 发布面卫生与基准复核清单
        shell: bash
        run: |
          node scripts/verify-release-hygiene.mjs
          node scripts/bench-release-checklist.mjs

      # A DSH home that looks like 0.1.7+: the profile patch layer exists, so the
      # installers take the plugin-row path instead of the legacy directory path.
      - name: Prepare a DSH home (0.1.7 layout)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dsh/profiles/web"
          printf '# ci profile patch\n[]\n' > "$RUNNER_TEMP/dsh/profiles/web/cordis.patch.yml"

      # Install with the script a user of that OS would actually run, so a
      # bash-only or PowerShell-only installer cannot slip through unnoticed.
      - name: Install presets (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: DSH_HOME="$RUNNER_TEMP/dsh" bash scripts/install.sh

      - name: Install presets (PowerShell)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -DshHome "$env:RUNNER_TEMP/dsh"

      # 之前 Windows 只测过默认安装，-WithRuntime 分支（写 ptc-runtime 再撤掉）从没在 CI 里跑过。
      - name: PowerShell -WithRuntime roundtrip
        if: runner.os == 'Windows'
        run: |
          $h = "$env:RUNNER_TEMP/dsh-runtime"
          New-Item -ItemType Directory -Force -Path "$h/profiles/web" | Out-Null
          # install.ps1 要求补丁文件已存在（它不负责建 profile），先按 0.1.7 布局铺一个。
          Set-Content -Path "$h/profiles/web/cordis.patch.yml" -Value "# ci profile patch`n[]" -Encoding utf8NoBOM
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -DshHome $h -WithRuntime
          $p = "$h/profiles/web/cordis.patch.yml"
          if (-not (Select-String -Path $p -Pattern 'executionMode: persistent-in-memory' -Quiet)) { throw "-WithRuntime 没有写入 ptc-runtime" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -DshHome $h -Uninstall
          if (Select-String -Path $p -Pattern 'executionMode: persistent-in-memory' -Quiet) { throw "-Uninstall 没有撤掉 ptc-runtime" }
          if (-not (Select-String -Path $p -Pattern '^\[\]$' -Quiet)) { throw "卸载后补丁不是空数组" }
          Write-Host "  -WithRuntime 往返 ok"

      - name: Re-install to prove idempotence
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/install.ps1 -DshHome "$RUNNER_TEMP/dsh"
          else
            DSH_HOME="$RUNNER_TEMP/dsh" bash scripts/install.sh
          fi
          blocks=$(grep -c 'dsh-flash-presets: managed block' "$RUNNER_TEMP/dsh/profiles/web/cordis.patch.yml")
          echo "managed-block marker lines: $blocks (expect 2)"
          [ "$blocks" -eq 2 ] || exit 1

      - name: Structural + cross-platform check (no dependencies)
        shell: bash
        run: DSH_HOME="$RUNNER_TEMP/dsh" node scripts/verify-presets.mjs

      # 历史 id 必须仍可解析：定义 / 别名 / 登记例外三者之一。缺 tag 时 exit 2（= 无法判定，也算失败）。
      - name: 历史 preset id 兼容性闸门
        shell: bash
        run: node scripts/check-preset-compat.mjs

      # 安装器只该动 profile 补丁层，不许碰会话目录（第五轮审计 T3-9：以前没有任何断言）。
      - name: 安装器不碰会话数据
        if: runner.os != 'Windows'
        shell: bash
        run: |
          h="$RUNNER_TEMP/dsh-nohea"
          mkdir -p "$h/profiles/web" "$h/sessions/proj-1"
          printf '[]\n' > "$h/profiles/web/cordis.patch.yml"
          printf 'marker\n' > "$h/sessions/proj-1/sess-1.log.zstd"
          # cksum 是 POSIX 命令：macOS runner 上没有 md5sum，BSD 的 xargs 也不认 -r。
          before=$(find "$h/sessions" -type f -exec cksum {} + | sort)
          DSH_HOME="$h" bash scripts/install.sh >/dev/null
          DSH_HOME="$h" bash scripts/install.sh --uninstall >/dev/null
          after=$(find "$h/sessions" -type f -exec cksum {} + | sort)
          [ "$before" = "$after" ] || { echo "::error::安装/卸载动过 $h/sessions"; exit 1; }
          echo "安装与卸载全程未触碰 sessions/"

      - name: 预设文本审计（编号/缩进/自相矛盾/平台路径/版本引用）
        shell: bash
        run: node scripts/lint-presets.mjs

      - name: Guard against the bash 3.2 multibyte trap (no dependencies)
        shell: bash
        run: node scripts/check-bash32-cjk.mjs

      - name: 组合包补丁层与 presets 同步
        shell: bash
        run: node scripts/compose-bundle-patch.mjs --check

      - name: YAML parse + value assertions
        shell: bash
        run: |
          node scripts/verify-yaml.mjs
          node scripts/verify-yaml.mjs "$RUNNER_TEMP/dsh/profiles/web/cordis.patch.yml"

      # 0.2.6 移除了 presets/legacy-0.1.5，旧版入口必须明确拒绝（exit 3），不能静默跳过。
      - name: Legacy install path is rejected (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/dsh-legacy/.agent-presets"
          DSH_HOME="$RUNNER_TEMP/dsh-legacy" bash scripts/install.sh --legacy
          irc=$?
          echo "install.sh --legacy 退出码: $irc（期望 3）"
          if [ "$irc" -ne 3 ]; then echo "::error::legacy install 退出码应为 3，实际 $irc"; exit 1; fi
          if [ -d "$RUNNER_TEMP/dsh-legacy/.agent-presets/flash-lean-ptc-v1" ]; then
            echo "::error::legacy 不应写入目录"; exit 1
          fi
          echo "legacy 已明确拒绝（exit 3，未写目录）"

      - name: Legacy install path is rejected (PowerShell)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/dsh-legacy/.agent-presets" | Out-Null
          pwsh -NoProfile -File scripts/install.ps1 -DshHome "$env:RUNNER_TEMP/dsh-legacy" -Legacy
          if ($LASTEXITCODE -ne 3) { Write-Error "legacy 退出码应为 3，实际 $LASTEXITCODE"; exit 1 }
          if (Test-Path "$env:RUNNER_TEMP/dsh-legacy/.agent-presets/flash-lean-ptc-v1") { Write-Error 'legacy 不应写入目录'; exit 1 }
          Write-Host 'legacy 已明确拒绝（exit 3，未写目录）'
          exit 0   # 否则 step 的退出码会沿用上一条原生命令的 3

      - name: Uninstall leaves the user patch intact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/install.ps1 -DshHome "$RUNNER_TEMP/dsh" -Uninstall
          else
            DSH_HOME="$RUNNER_TEMP/dsh" bash scripts/install.sh --uninstall
          fi
          # 断言安装器真正会写的那个 id（0.2.6 起安装器不再写 v2，原来的断言永远成立 = 没测）。
          if grep -q 'preset-flash-lean-ptc-v3' "$RUNNER_TEMP/dsh/profiles/web/cordis.patch.yml"; then
            echo "managed block still present after uninstall"; exit 1
          fi
          echo "uninstalled cleanly"

      # 仓库自带端到端自测：安装/卸载/幂等/legacy/发布守卫 一次跑完
      - name: Self-test (bash end-to-end)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/selftest.sh

      # 整体组合：预设 + 插件装进临时 DSH_HOME（本 job 没装 dsh → 验证降级提示）
      - name: 整体组合自测（无 dsh 分支）
        shell: bash
        run: bash scripts/selftest-integration.sh

      # 没装 pwsh 的机器上也能审 PowerShell 脚本（三平台都跑）
      - name: Static check (PowerShell scripts)
        shell: bash
        run: node scripts/check-ps1.mjs

  # issue #23：Windows 上 `npm i -g @deepseek-ai/dsh` 装出来的是 dsh.cmd，没有 dsh.exe。
  # `execFileSync('dsh', …)` 不做 PATHEXT 解析 → ENOENT；`execFileSync('dsh.cmd', …)` → EINVAL。
  # 以前 doctor / verify-runtime / tune-runtime / diag / audit-* 全在这条路上静默失效，而 CI 只有 Linux，
  # 所以一直没人发现。这个 job 就是让这类回归变红。
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 安装 DSH（npm 全局装出来的是 dsh.cmd）
        shell: bash
        run: |
          npm i -g pnpm @deepseek-ai/dsh@0.2.2-rc.1
          dsh --version

      - name: runDsh 包装能调起 dsh
        shell: bash
        run: |
          node -e "import('./scripts/lib/run-dsh.mjs').then((m) => { const r = m.resolveDsh(); console.log('resolved:', JSON.stringify(r)); const v = m.tryDshVersion(); console.log('version:', v); if (!v) { console.error('runDsh 调不到 dsh —— issue #23 回归'); process.exit(1); } })"

      - name: 装上组合包后 doctor / verify-runtime 在 Windows 上真的能跑
        shell: bash
        run: |
          dsh plugin --profile ci add . 2>&1 | tail -3
          dsh --profile ci --dump-config > "$RUNNER_TEMP/dump.txt"
          node scripts/verify-runtime.mjs "$RUNNER_TEMP/dump.txt" | tail -3
          node scripts/doctor.mjs --profile ci --dump > "$RUNNER_TEMP/doctor.log" 2>&1 || true
          tail -15 "$RUNNER_TEMP/doctor.log"
          for bad in "找不到 dsh 命令" "dsh 能定位但调不起来"; do
            if grep -q "$bad" "$RUNNER_TEMP/doctor.log"; then
              echo "::error::doctor 在 Windows 上拿不到 dsh（$bad）—— issue #23 回归"
              exit 1
            fi
          done
          # tune-runtime / diag-preset-load / audit-compat 走同一条 runDsh 路径，抽查两条即可
          node scripts/tune-runtime.mjs --check --profile ci | head -5
          node scripts/audit-compat.mjs --dsh-home "$RUNNER_TEMP/nohome" --profile ci 2>&1 | head -5 || true
  # 真实安装验证（评审清单第 7 项）：把本组合包装进一个全新 profile，
  # 再断言两个预设行确实进了组合配置——证明"装得上"且"装完真的生效"。
  bundle-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: ["0.2.1-rc.5", "0.2.2-rc.1"]   # 声明的下限 + npm latest（用户实际装到的版本）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'   # dsh CLI 在 Node 20 下会静默退出（0 输出 / 退出码 0）

      - name: 安装 DSH 与 pnpm
        run: npm i -g pnpm @deepseek-ai/dsh@${{ matrix.dsh }}   # 矩阵覆盖 engines 下限与 npm latest；canary 走脚本路径，不加载插件，不能替代这里

      - name: 环境诊断
        run: |
          set -x
          which -a dsh || true
          dsh --version || true
          node -v; pnpm -v; echo "HOME=$HOME DSH_HOME=${DSH_HOME:-unset}"
          ls -la "$HOME/.dsh" 2>/dev/null || echo "(尚无 ~/.dsh)"

      - name: dsh plugin add（组合包一键安装）
        run: |
          set -o pipefail
          dsh plugin --profile ci add . 2>&1 | tee /tmp/add.log
          echo "add 退出码: ${PIPESTATUS[0]}"
          echo "--- profile 清单 ---"
          cat "$HOME/.dsh/profiles/ci/package.json" 2>/dev/null || { echo "profile 未创建，目录树："; find "$HOME/.dsh" -maxdepth 3 2>/dev/null | head -20; }

      - name: 断言两个预设进组合配置（旧 id 不进）
        run: |
          # 注意：dump-config 是旗标（--dump-config），当子命令跑会挂起且 stdout 为空
          dsh --profile ci --dump-config > "$RUNNER_TEMP/dump.txt" 2> "$RUNNER_TEMP/dump.err" || echo "dump 退出码非 0"
          echo "dump 大小: $(wc -c < "$RUNNER_TEMP/dump.txt") B；stderr 尾部："
          tail -5 "$RUNNER_TEMP/dump.err" || true
          echo "dump 前 5 行："; head -5 "$RUNNER_TEMP/dump.txt" || true
          # 0.2.6 起只发两个预设：lite 与 balance。id 必须精确比对——`flash-lean-ptc-v3`
          # 是 `-v3-lite` / `-v3-balance` 的子串，用 grep 子串匹配等于什么都没断言。
          for id in flash-lean-ptc-v3 flash-lean-ptc-v3-balance; do
            n=$(grep -cE -- "$id([^-]|$)" "$RUNNER_TEMP/dump.txt" || true)
            grep -m2 -E -- "$id" "$RUNNER_TEMP/dump.txt" | sed "s/^/    /" || true
            echo "$id: $n"
            [ "$n" -ge 1 ] || { echo "::error::$id 未进入组合配置"; exit 1; }
          done
          # 0.2.9 起发行包只有 lean-v3 与 balance；v1/v2/v3b/v3e 不随包发行，历史三别名也不建卡。
          for id in flash-lean-ptc-v1 flash-lean-ptc-v2 flash-lean-ptc-v3-lite flash-lean flash-lean-ptc; do
            n=$(grep -cE -- "id: preset-$id(\s|$)" "$RUNNER_TEMP/dump.txt" || true)
            echo "$id: $n（期望 0）"
            [ "$n" -eq 0 ] || { echo "::error::$id 不应进组合配置"; exit 1; }
          done

      # 装到真实 DSH 上的组合配置：别名表指向的 id 必须真的在里面（0.2.8→0.2.9 那次事故的形状）。
      - name: 别名层 × 真实组合配置
        run: node tools/probe/alias-vs-config.mjs "$RUNNER_TEMP/dump.txt"

      # 只断言"id 出现过"还不够：order / 阈值 / 规则条数 / PTC 才是预设真正的行为参数
      - name: 断言合成结果里的取值
        run: node scripts/verify-runtime.mjs "$RUNNER_TEMP/dump.txt"

  canary:
    name: canary (dsh latest)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 安装 latest DSH
        run: npm i -g pnpm @deepseek-ai/dsh
      - name: 运行时合成断言（latest）
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh"
          mkdir -p "$DSH_HOME/profiles/web"
          printf '# canary\n[]\n' > "$DSH_HOME/profiles/web/cordis.patch.yml"
          bash scripts/install.sh --profile web
          rc=0
          dsh --profile web --dump-config > "$RUNNER_TEMP/dump.yml" 2>/dev/null || rc=$?
          if [ "$rc" -ne 0 ]; then echo "dsh 无法合成 —— latest 可能不兼容"; exit 1; fi
          node scripts/verify-runtime.mjs "$RUNNER_TEMP/dump.yml"

  # 真实 dsh 环境下的整体组合：--with-plan-mode 装插件 + doctor --all 全绿
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: 安装 DSH 与 pnpm
        run: npm i -g pnpm @deepseek-ai/dsh@0.2.1-rc.5
      - name: 整体组合自测（有 dsh 分支）
        run: bash scripts/selftest-integration.sh

  # 插件自测：11 个 test/*.mjs 全跑（v0.5.3 起从 2 个扩到 11 个；之前 CI 完全不跑插件测试）。
  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]   # zstdDecompressSync 从 Node 22.15 起才有，20 会直接 import 失败
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      # 插件的 peer 依赖 @deepseek-ai/dsh-llm 由 DSH 自带，装一个全局 DSH 即可解析。
      - name: 安装 DSH（提供 @deepseek-ai/dsh-llm）
        run: npm i -g @deepseek-ai/dsh@0.2.1-rc.5
      - name: 跑插件全量测试
        working-directory: plugins/plan-mode-ui
        run: bash test/run.sh

  # 用户侧回归：装的是 npm 包内容，不是仓库目录。在只发出去的那些文件里跑一遍用户真会跑的命令，
  # 才能发现「白名单把 doctor 依赖的脚本排掉了」这类只有安装后才炸的问题（第二轮审计 N2-1 / N3-7）。
  pack-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 打包并解包
        run: |
          mkdir -p /tmp/pkg && npm pack --ignore-scripts --pack-destination /tmp/pkg
          mkdir -p /tmp/pkg/x && tar xzf /tmp/pkg/*.tgz -C /tmp/pkg/x
          ls /tmp/pkg/x/package
      - name: 从解包目录跑用户侧脚本（doctor / tune-runtime / verify-presets）
        run: |
          export DSH_HOME=/tmp/pkg-home
          mkdir -p "$DSH_HOME/profiles/web"
          printf -- '- id: placeholder\n' > "$DSH_HOME/profiles/web/cordis.patch.yml"
          P=/tmp/pkg/x/package/scripts
          # 这个环境里 doctor 必然有 problems（没装 dsh，dump-config 跑不起来），退出码应为非 0（R3-8）
          if node "$P/doctor.mjs" --profile web --all > /tmp/doctor.out 2>&1; then
            echo "::error::doctor 有 problems 却退出 0"; cat /tmp/doctor.out; exit 1
          fi
          if ! node "$P/doctor.mjs" --profile web --all --warn-only > /tmp/doctor2.out 2>&1; then
            echo "::error::doctor --warn-only 不应退出非 0"; cat /tmp/doctor2.out; exit 1
          fi
          if ! grep -qE '旧 id 由运行时兼容层解析|本形态没有兼容层' /tmp/doctor.out; then
            echo "::error::doctor 第 7 节没有说明旧 id 的解析路径"; cat /tmp/doctor.out; exit 1
          fi
          # 这个 job 从解包目录直跑（没装插件卡）→ 没有别名层，doctor 必须说实话（第六轮 U1-3），
          # 不能再说「由运行时兼容层解析 ✓」。
          if ! grep -q '本形态没有兼容层' /tmp/doctor.out; then
            echo "::error::解包直跑没有别名层，doctor 却没说「本形态没有兼容层」"; cat /tmp/doctor.out; exit 1
          fi
          # 打包件里 tune-runtime 要能真写进去、再撤干净（R1-2 那道回归的防线）
          node "$P/tune-runtime.mjs" --apply --profile web
          if ! grep -q 'persistent-in-memory' "$DSH_HOME/profiles/web/cordis.patch.yml"; then
            echo "::error::tune-runtime --apply 没写入"; exit 1
          fi
          node "$P/tune-runtime.mjs" --revert --profile web
          if grep -q 'tune-runtime' "$DSH_HOME/profiles/web/cordis.patch.yml"; then
            echo "::error::tune-runtime --revert 没撤干净"; exit 1
          fi
          node "$P/verify-presets.mjs" --repo-only
      - name: 断言包内不含写会话的维护脚本
        run: |
          for f in migrate-legacy-preset-ids.mjs retarget-session-presets.mjs; do
            [ ! -e "/tmp/pkg/x/package/scripts/$f" ] || { echo "::error::$f 不应随包发布"; exit 1; }
          done
          test -f /tmp/pkg/x/package/NOTICE || { echo "::error::NOTICE 未随包发布"; exit 1; }
