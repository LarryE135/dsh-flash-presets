name: npm downloads badge

# npm 的 relative-window 端点（last-day/week/month）会返回陈旧区间，刚发布的包会一直显示 0/月。
# 这个 workflow 按「显式日期区间」查一次，把结果写进 badges/downloads.json，
# README 用 shields.io 的 endpoint badge 读它（见 README 顶部 npm downloads 徽章）。
#
# 2026-11-17：main 开了分支保护（required_status_checks，无绕过），本 workflow 不再往 main 提交，
# 改为把 JSON 推到长期分支 badges；README 的 endpoint 徽章指向该分支的 raw 文件。
# 触发策略（2026-10-28 调整）：
#   push      —— 每次往 main 推代码时顺手刷新（实测一次约 13s），README 不会落后几天；
#   schedule  —— 每天兜底一次。GitHub 的 cron 是 best-effort，可能延迟甚至整次漏跑
#                （2026-10-28 03:23Z 那次就没有出现运行记录），所以不能只靠它；
#   dispatch  —— 手动兜底：gh workflow run npm-downloads-badge.yml --ref main
# 防自激有两层：bot 自己的提交不再触发（job 级 if），且脚本发现数值没动就不提交。
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # 每天 05:23 UTC，避开整点拥塞
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-downloads-badge
  cancel-in-progress: false

jobs:
  badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 默认 360 分钟：脚本卡住就是白占 runner（本轮 P3）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Regenerate badges/downloads.json
        run: node scripts/npm-downloads-badge.mjs

      - name: Commit when the number moved
        run: |
          set -euo pipefail
          # 比较基准是 badges 分支上的文件，不是 main（第二轮审计 P2-1）：main 已受分支保护、
          # 不再被这个 job 写，它那份 JSON 会一直停在切换前，拿它比等于每次都「有变化」。
          if git fetch -q --depth=1 origin badges 2>/dev/null; then
            if git show origin/badges:badges/downloads.json 2>/dev/null | diff -q - badges/downloads.json >/dev/null; then
              echo "downloads unchanged — nothing to commit"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json
          git commit -m "chore(badge): npm downloads $(date -u +%F)"
          # 只推 badges：main 开了必过状态检查且无绕过，直推会被 GH013 拒绝。
          # 该分支只放这一个 JSON，允许强推，也就不需要 rebase 重试那套。
          for attempt in 1 2 3 4 5; do
            if git push --force origin HEAD:badges; then
              echo "pushed to badges on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::badge push rejected 5 times"
          exit 1
