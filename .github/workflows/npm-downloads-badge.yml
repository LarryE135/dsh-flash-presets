name: npm downloads badge

# npm 的 relative-window 端点（last-day/week/month）会返回陈旧区间，刚发布的包会一直显示 0/月。
# 这个 workflow 按「显式日期区间」查一次，把结果写进 badges/downloads.json，
# README 用 shields.io 的 endpoint badge 读它（见 README 顶部 npm downloads 徽章）。
#
# 触发策略（2026-10-28 调整）：
#   push      —— 每次往 main 推代码时顺手刷新（实测一次约 13s），README 不会落后几天；
#   schedule  —— 每天兜底一次。GitHub 的 cron 是 best-effort，可能延迟甚至整次漏跑
#                （2026-10-28 03:23Z 那次就没有出现运行记录），所以不能只靠它；
#   dispatch  —— 手动兜底：gh workflow run npm-downloads-badge.yml --ref main
# 防自激有两层：bot 自己的提交不再触发（job 级 if），且脚本发现数值没动就不提交。
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # 每天 05:23 UTC，避开整点拥塞
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-downloads-badge
  cancel-in-progress: false

jobs:
  badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Regenerate badges/downloads.json
        run: node scripts/npm-downloads-badge.mjs

      - name: Commit when the number moved
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/downloads.json; then
            echo "downloads unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json
          git commit -m "chore(badge): npm downloads $(date -u +%F)"
          # 守卫：本 job 与人工推送会撞车（2026-11-04 出现过 'remote rejected main -> main'，
          # 因为 badge 运行期间 main 又被推了一次）。改成 rebase 重试：
          # 冲突时只重建这一条提交，最多 5 次，仍失败才红。
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          echo "::error::badge push rejected 5 times"
          exit 1
