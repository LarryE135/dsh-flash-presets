name: npm downloads badge

# npm 的 relative-window 端点（last-day/week/month）会返回陈旧区间，刚发布的包会一直显示 0/月。
# 这个 workflow 按「显式日期区间」查一次，把结果写进 badges/downloads.json，
# README 用 shields.io 的 endpoint badge 读它（见 README 顶部 npm downloads 徽章）。
#
# 触发策略（2026-10-28 调整）：
#   push      —— 每次往 main 推代码时顺手刷新（实测一次约 13s），README 不会落后几天；
#   schedule  —— 每天兜底一次。GitHub 的 cron 是 best-effort，可能延迟甚至整次漏跑
#                （2026-10-28 03:23Z 那次就没有出现运行记录），所以不能只靠它；
#   dispatch  —— 手动兜底：gh workflow run npm-downloads-badge.yml --ref main
# 防自激有两层：bot 自己的提交不再触发（job 级 if），且脚本发现数值没动就不提交。
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # 每天 05:23 UTC，避开整点拥塞
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-downloads-badge
  cancel-in-progress: false

jobs:
  badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Regenerate badges/downloads.json
        run: node scripts/npm-downloads-badge.mjs

      - name: Commit when the number moved
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/downloads.json; then
            echo "downloads unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json
          git commit -m "chore(badge): npm downloads $(date -u +%F)"
          git push
