# v3「全量版」规划：先写全（发散），再写死（收敛成可执行验收）
# 与 v2 的分工：v3 = 全量版（问题不清、需要探索时用）；v2 = 轻量版（问题清楚、只要验收清单时用）
- id: compaction-basic
  options:
    thresholdRatio: 0.72
    keepRecentTurns: 6
- id: agent-instructions
  options:
    append: |
      你现在只做规划核查，不要写实现代码。

      按两个阶段工作，顺序不能颠倒。

      ## 阶段 1：写全（发散，允许长）
      产出 EVIDENCE.md，把你查到的和想到的全部写下来，分成四块：
      - 事实：只写你**实际执行过命令/读取过文件**得到的结论，格式 `F# | 断言 | 命令 | 观察到的输出`。没跑过的写成 `UNKNOWN` 并给出能定论的那条命令。
      - 约定：一猜错就会产出「看起来正常但实际是坏的」产物的那些取值（方向、单位、坐标系、色彩空间、取整规则）。
      - 歧义：能有两种读法的要求，各自的代价，最便宜的区分办法。
      - 边界：0 / 1 / 最大规模 / 缺功能 / 慢设备 / 平台差异，各自该退化成什么。
      这一阶段不设长度上限，但**每一条都必须打一个可验性标记**：
      `✅可命令`（能用一条命令判定） `👁只能看图/手感` `🤷不知道`。

      ## 阶段 2：写死（收敛，只留能兑现的）
      从阶段 1 里把 ✅ 的**抄**出来，形成三份文件：
      - CONVENTIONS.md：最多 20 行，四列 `ID | 约定（取值） | 一句理由 | 违规如何被测出`；每条都必须能被命令、状态读数或图像数值判定。
      - P0-EXEC.yml：8–14 条，每条 `id / assert / run / expect / source`，其中 `run` 必须是一条可直接执行的命令，`source` 写来源编号（如 F7）；写不出可执行 run 的**从 P0 里删掉**，不许留散文断言。
      - P1-TARGETS.yml：3–6 条纯数值目标 `id / metric / min / max / how`，只用于引导力度，不作通过判据。
      👁 的条目降级进 P1 并注明"需人工看"；🤷 的必须先跑一条探测命令，探完再回来重判，不许悬空。

      ## 硬规则
      - 阶段 2 的每一条都必须能在 EVIDENCE.md 里找到来源；找不到来源的条目不允许进 P0。
      - 若两条要求不能同时成立，标【冲突】并写明"只能由用户裁决"，不许自己挑一个。
      - 用简体中文写正文，标题保留英文 ID。
      - 全部产出后停止，不要创建 index.html 或任何应用代码。
