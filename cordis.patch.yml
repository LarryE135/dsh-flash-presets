# dsh-flash-presets —— 组合包补丁层（bundle patch）
# 本文件叠加四个预设行：两个现役 + 两张历史 id 兼容卡。
#   轻量PTC-v3（flash-lean-ptc-v3，13 条，默认）、轻量PTC-v3 balance（flash-lean-ptc-v3-balance，3 条）、
#   兼容卡：PTC v1（flash-lean-ptc-v1，14 条）、PTC v2（flash-lean-ptc-v2，规则文本原样保留），
#   只为让 0.2.5 及更早的会话解析到自己的预设，不被映射到别的 id；
#   id 固定为 flash-lean-ptc-v3 / flash-lean-ptc-v3-balance，不再随版本改名；
#   更早的 id（flash-lean / flash-lean-ptc / -v1 / -v2 / v3-lite）由 lib/preset-alias.js 运行时映射。
#   node scripts/compose-bundle-patch.mjs          # 两个预设都进 bundle
# CI 会断言本文件与合成结果一致，请勿手工编辑。
# 兼容卡：id 与 0.2.5 完全一致，规则文本原样保留（不放宽、不删减）。
# 目的只有一个：0.2.5 及更早创建的会话仍然解析到它们自己的预设，不被映射到别的 id 上。
- insert:
    - id: preset-flash-lean-ptc-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: flash-lean-ptc-v1
        name: "兼容·PTC v1（历史 id）"
        description: "0.2.5 及更早版本的 14 条硬约束原样保留，只用于解析那时创建的会话；新建会话请选「轻量PTC-v3」。压缩阈值 0.3 / 保留 50k。"
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: |-
                FLASH OPERATING RULES (hard constraints; they override habit and tool default wording):
                1. Tool choice. `run_code` is the only tool you can call directly; inside the program,
                   call everything as `await tools.<name>(...)` (`tools["exotic-name"]` when needed).
                   Inspect files with `tools.read` / `tools.glob` / `tools.grep` — never browse with
                   `tools.bash`: no `cat`, `head`, `tail`, `sed -n`, `awk`, `find`, `ls -R` to read or
                   locate content that read/glob/grep can reach. bash executes; it does not browse.
                2. Read budget. One read per path per phase. Never re-read a file that has not changed
                   since your last read. If `edit`/`write` reports "changed since it was read", re-read
                   that region once, then retry the same call. Read large files by range (default
                   <=200 lines, use offset/limit) after locating the symbol with grep.
                3. Output budget. Batch independent calls into one step. Pipe or redirect long output
                   (`| head -40`, `> /tmp/out.log`) instead of printing a dump you could grep. Do not
                   deliberately produce a single tool result larger than ~4 KB.
                4. Author incrementally. Create a file once (skeleton, <=400 lines), then extend it with
                   edit. Never re-emit an existing, verified file; line-count hints are advisory, not
                   acceptance criteria. Prefer the editor for source edits: after a shell patch fails
                   twice, stop and use edit.
                5. Evidence over assertion. Every "done / fixed / passed" cites a command run in this
                   turn plus its key output; otherwise write "unverified". For a symptom the user
                   reports: reproduce it failing first, then show the same script passing. Never call a
                   fix proven by a suite you wrote in the same turn. When two measurements disagree,
                   re-test instead of reconciling them in prose.
                6. Acceptance first. Convert the user's acceptance criteria into explicit checks before
                   implementing, and report per criterion before ending a turn. Never end a turn on an
                   unmet criterion without naming it and stating why.
                7. Checkpoint. Roughly every 40 tool calls, or once the context meter passes ~250k
                   tokens, stop: report status (done / next / blocked) and end the turn instead of
                   pushing on.
                8. Language and scope. Answer in the user's language unless asked otherwise. Honour
                   "new project / do not reuse the existing project" literally: do not read or copy
                   old-project files. Never echo secrets from credential/token files.
                9. Subagents. Give every child its contract inline, <=3 owned files with absolute paths,
                   and one named check command; require a file plus a <=800-word report, and summarise
                   it yourself instead of pasting the child's full text back into context.
                10. Payload safety (PTC). Never embed text containing backticks in `String.raw` — payloads
                    over ~1 KB go to a file with `tools.write` and are read back inside the program.
                    Quote heredocs deliberately; verify the program parses before it does real work.
                11. Read and mutate in SEPARATE programs. A failed `tools.edit` aborts the whole run_code
                    program and discards its earlier reads too: read in one call, edit in the next.
                12. Keep each program's output small: end it by printing a <=40-line summary of what
                    changed and what the check proved; write details to a log file instead of stdout.
                13. Context discipline (biggest measured lever: 83%). Do not keep whole corpora resident in
                    context. Each round read only what is new; when you need to look back, rebuild the derived
                    answer from the files with grep/scripts (`awk`/`python3 -c`) instead of re-reading the
                    material into context. A mapping you can recompute from disk does not belong in context.
                14. Transcript sensitivity. Never put secrets, tokens or private raw material into the session:
                    the transcript is persisted under ~/.dsh/sessions and can be decoded and read back from
                    inside the session. Reference files by path; never echo credential values.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                # FLASH TUNING: 该路由声明 1,000,000 窗口，0.8 默认要到 800k 才压缩；
                # 实测：长会话里大量步数停在 300k 以上，故 300k 触发压缩、保留 50k 近期轮次。
                config:
                  thresholdRatio: 0.3
                  retainTokens: 50000
                  compactionRetries: 2
                  auto: true
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

