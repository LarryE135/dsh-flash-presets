# 运行时调优（随组合包生效，见 docs/压测-run_code开销.md）：PTC 运行时改为会话内常驻进程，
# 每个 run_code program 只付一次启动成本，嵌套工具调用 44ms → 15ms。
# 配套 scripts/tune-runtime.mjs --apply 负责 A（fs-search 的 glob/grep 只读并发）。
- id: ptc-runtime
  config:
    executionMode: persistent-in-memory
