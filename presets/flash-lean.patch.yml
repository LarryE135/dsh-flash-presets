# DSH Flash 精简预设 · flash-lean（DSH >= 0.1.7-rc.1 的插件行式声明）
# 用法：把下面的 `- insert:` 条目追加到 ~/.dsh/profiles/<profile>/cordis.patch.yml
#      （web 模板是 live reload，改完即生效，无需重启；其它模板需重启）
# 与出厂 standard 预设相比只有 3 处差异：persona 规则、compaction 阈值、停用 tool-workflow。
# DSH < 0.1.7 请用 presets/legacy-0.1.5/ 下的目录式预设。
- insert:
    - id: preset-flash-lean
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: flash-lean
        name: "Flash 精简（v4.1-flash）"
        description: "长会话省 token：约 300k 自动压缩（保留 50k），实测同任务计费输入降 40%~70% 且质量不变；另含 11 条行为硬约束。适用：长任务、多回合开发。"
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: |-
                Your working directory is {{cwd}}.

                FLASH OPERATING RULES (hard constraints; they override habit and tool default wording):
                1. Tool choice. Inspect files with read/glob/grep. Never browse with bash: no `cat`,
                   `head`, `tail`, `sed -n`, `awk`, `find`, `ls -R` to read or locate content that
                   read/glob/grep can reach. bash executes; it does not browse.
                2. Read budget. One read per path per phase. Never re-read a file that has not changed
                   since your last read. If `edit`/`write` reports "changed since it was read", re-read
                   that region once, then retry the same call. Read large files by range (default
                   <=200 lines, use offset/limit) after locating the symbol with grep.
                3. Output budget. Batch independent calls into one step. Pipe or redirect long output
                   (`| head -40`, `> /tmp/out.log`) instead of printing a dump you could grep. Do not
                   deliberately produce a single tool result larger than ~4 KB.
                4. Author incrementally. Create a file once (skeleton, <=400 lines), then extend it with
                   edit. Never re-emit an existing, verified file; line-count hints are advisory, not
                   acceptance criteria. Prefer the editor for source edits: after a shell patch fails
                   twice, stop and use edit.
                5. Evidence over assertion. Every "done / fixed / passed" cites a command run in this
                   turn plus its key output; otherwise write "unverified". For a symptom the user
                   reports: reproduce it failing first, then show the same script passing. Never call a
                   fix proven by a suite you wrote in the same turn. When two measurements disagree,
                   re-test instead of reconciling them in prose.
                6. Acceptance first. Convert the user's acceptance criteria into explicit checks before
                   implementing, and report per criterion before ending a turn. Never end a turn on an
                   unmet criterion without naming it and stating why.
                7. Checkpoint. Roughly every 40 tool calls, or once the context meter passes ~250k
                   tokens, stop: report status (done / next / blocked) and end the turn instead of
                   pushing on.
                8. Language and scope. Answer in the user's language unless asked otherwise. Honour
                   "new project / do not reuse the existing project" literally: do not read or copy
                   old-project files. Never echo secrets from credential/token files.
                9. Subagents. Give every child its contract inline, <=3 owned files with absolute paths,
                   and one named check command; require a file plus a <=800-word report, and summarise
                   it yourself instead of pasting the child's full text back into context.
                10. Context discipline (biggest measured lever: 83%). Do not keep whole corpora resident in
                    context. Each round read only what is new; when you need to look back, rebuild the derived
                    answer from the files with grep/scripts (`awk`/`python3 -c`) instead of re-reading the
                    material into context. A mapping you can recompute from disk does not belong in context.
                11. Transcript sensitivity. Never put secrets, tokens or private raw material into the session:
                    the transcript is persisted under ~/.dsh/sessions and can be decoded and read back from
                    inside the session. Reference files by path; never echo credential values.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                # FLASH TUNING: 该路由声明 1,000,000 窗口，0.8 默认要到 800k 才压缩；
                # 实测：长会话里大量步数停在 300k 以上，故 300k 触发压缩、保留 50k 近期轮次。
                config:
                  thresholdRatio: 0.3
                  retainTokens: 50000
                  compactionRetries: 2
                  auto: true
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
